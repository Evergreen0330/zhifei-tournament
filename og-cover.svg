<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="240" fill="url(#glow)"/>
  <circle cx="120" cy="560" r="220" fill="url(#glow)" opacity="0.6"/>

  <!-- logo mark -->
  <g transform="translate(80,90)">
    <rect width="92" height="92" rx="22" fill="url(#mark)"/>
    <path d="M20 64 L40 32 L52 46 L72 24" stroke="white" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="24" r="6" fill="white"/>
  </g>
  <text x="200" y="138" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="700">知飞赛事</text>
  <text x="200" y="175" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">Saas Tournament Platform</text>

  <!-- main headline -->
  <text x="80" y="320" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="700">一站式办赛</text>
  <text x="80" y="395" fill="url(#accent)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="700">从创建到归档</text>
  <text x="80" y="455" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24">面向无人机足球 / POP 穿越 / FPV / 翼客虚拟飞行的赛事 SaaS</text>

  <!-- type tags -->
  <g transform="translate(80,500)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600">
    <g transform="translate(0,0)">
      <rect width="170" height="46" rx="23" fill="rgba(6,182,212,.16)" stroke="rgba(6,182,212,.5)" stroke-width="1.5"/>
      <text x="85" y="30" fill="#67e8f9" text-anchor="middle">⚽ 无人机足球</text>
    </g>
    <g transform="translate(190,0)">
      <rect width="180" height="46" rx="23" fill="rgba(139,92,246,.16)" stroke="rgba(139,92,246,.5)" stroke-width="1.5"/>
      <text x="90" y="30" fill="#c4b5fd" text-anchor="middle">🛩️ POP 穿越</text>
    </g>
    <g transform="translate(390,0)">
      <rect width="200" height="46" rx="23" fill="rgba(249,115,22,.16)" stroke="rgba(249,115,22,.5)" stroke-width="1.5"/>
      <text x="100" y="30" fill="#fdba74" text-anchor="middle">🎮 翼客虚拟飞行</text>
    </g>
    <g transform="translate(610,0)">
