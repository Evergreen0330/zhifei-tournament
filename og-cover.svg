      <text x="85" y="30" fill="#fca5a5" text-anchor="middle">🏁 FPV 竞速</text>
    </g>
  </g>

  <!-- footer url -->
  <text x="80" y="595" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16">6156e0f1ddf649e79ef6bdd315c87f7e.app.workbuddy.link</text>
